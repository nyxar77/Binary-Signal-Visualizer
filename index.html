<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary Signal Visualizer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div>
          <p class="eyebrow">Digital communications lab</p>
          <h1>Binary Signal Visualizer</h1>
          <p class="subtitle">See every bit become a physical signal.</p>
        </div>
        <label class="theme-picker" for="theme-select">
          <span>Palette</span>
          <select id="theme-select" aria-label="Color palette">
            <option value="system">Default · browser</option>
            <option value="latte">Latte</option>
            <option value="frappe">Frappé</option>
            <option value="macchiato">Macchiato</option>
            <option value="mocha">Mocha</option>
          </select>
        </label>
      </header>

      <!-- Input Section -->
      <section class="card input-section">
        <label for="binary-input">Binary sequence</label>
        <input
          type="text"
          id="binary-input"
          placeholder="e.g., 10101"
          maxlength="64"
        />
        <div id="input-error" class="error"></div>
      </section>

      <!-- Encoding Selection -->
      <section class="card encoding-section">
        <h2>Select Encoding</h2>
        <div class="encoding-buttons" id="encoding-buttons">
          <button data-encoding="unipolar">Unipolar</button>
          <button data-encoding="nrz-l">NRZ-L</button>
          <button data-encoding="nrz-i">NRZ-I</button>
          <button data-encoding="manchester">Manchester</button>
          <button data-encoding="b8zs">B8ZS</button>
          <button data-encoding="hdb3">HDB3</button>
        </div>
      </section>

      <!-- Legend -->
      <section class="card legend-section">
        <h3>Legend</h3>
        <div id="legend">Select an encoding to see explanation.</div>
      </section>

      <!-- Chart -->
      <section class="card chart-section">
        <canvas id="signal-chart"></canvas>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
