<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary Signal Visualizer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div>
          <p class="eyebrow">Line encoding</p>
          <h1>Binary Signal Visualizer</h1>
          <p class="subtitle">Inspect how binary data is represented on a signal.</p>
        </div>
        <div class="header-actions">
          <a class="github-button" href="https://github.com/nyxar77/Binary-Signal-Visualizer" target="_blank" rel="noreferrer" aria-label="Open Binary Signal Visualizer on GitHub">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.3 11.3 0 0 0-3.6 22c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.3-1.3-1.6-1.3-1.6-1-.7.1-.7.1-.7 1.1.1 1.7 1.1 1.7 1.1 1 .1.3 1.9 2.6 1.3.1-.7.4-1.2.7-1.5-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A11.3 11.3 0 0 0 12 .7Z"/></svg>
            <span>GitHub</span>
          </a>
          <div class="theme-control" id="theme-control">
          <button class="theme-button" id="theme-button" type="button" aria-expanded="false" aria-controls="theme-popover">
            <span class="theme-dot" id="theme-dot" aria-hidden="true"></span>
            <span>Theme</span>
            <strong id="theme-button-label">Mocha</strong>
          </button>
          <div class="theme-popover" id="theme-popover" hidden>
            <div class="theme-card-header">
              <div>
                <h2 id="theme-heading">Appearance</h2>
                <p>Choose a Catppuccin flavour or accent.</p>
              </div>
              <strong id="active-theme">Mocha · Mauve</strong>
            </div>
            <div class="theme-controls">
              <div class="flavour-buttons" id="flavour-buttons" aria-label="Theme flavour">
                <button type="button" data-flavour="system" aria-pressed="false">Default</button>
                <button type="button" data-flavour="latte" aria-pressed="false">Latte</button>
                <button type="button" data-flavour="frappe" aria-pressed="false">Frappé</button>
                <button type="button" data-flavour="macchiato" aria-pressed="false">Macchiato</button>
                <button type="button" data-flavour="mocha" aria-pressed="false">Mocha</button>
              </div>
              <div class="accent-swatches" id="accent-swatches" aria-label="Theme accent"></div>
            </div>
          </div>
          </div>
        </div>
      </header>

      <section class="card input-section">
        <div class="section-heading">
          <label for="binary-input">Binary sequence</label>
          <button class="quiet-button" id="share-button" type="button">Copy link</button>
        </div>
        <input
          type="text"
          id="binary-input"
          placeholder="e.g., 10101"
          maxlength="64"
        />
        <div id="input-error" class="error"></div>
        <div class="status" id="share-status" role="status" aria-live="polite"></div>
      </section>

      <section class="card encoding-section">
        <h2>Select Encoding</h2>
        <div class="encoding-buttons" id="encoding-buttons">
          <button data-encoding="unipolar">Unipolar</button>
          <button data-encoding="unipolar-rz">Unipolar RZ</button>
          <button data-encoding="nrz-l">NRZ-L</button>
          <button data-encoding="nrz-i">NRZ-I</button>
          <button data-encoding="polar-rz">Polar RZ</button>
          <button data-encoding="manchester">Manchester</button>
          <button data-encoding="differential-manchester">Diff. Manchester</button>
          <button data-encoding="bipolar-ami">Bipolar AMI</button>
          <button data-encoding="b8zs">B8ZS</button>
          <button data-encoding="hdb3">HDB3</button>
        </div>
      </section>

      <section class="card legend-section">
        <h3>Legend</h3>
        <div id="legend">Select an encoding to see explanation.</div>
      </section>

      <section class="card chart-section">
        <canvas id="signal-chart"></canvas>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
